[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "le-chonk-plays-games"
version = "0.1.0"
description = "AI-powered game assistant: screenshot in, best move out, auto-played via X11 input injection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rostyfi" }]
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
lechonk = "lechonk.auto_play:main"
lechonk-advise = "lechonk.advisor:main"
lechonk-gui = "lechonk.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
